<nav class="navbar navbar-expand-lg app-glass-nav sticky-top">
  <div class="container-fluid px-lg-4">
    <!-- Brand -->
    <a class="navbar-brand d-flex align-items-center gap-2 cursor-pointer" routerLink="/home" (click)="closeMenu()">
      <img src="assets/images/logo.png" alt="Fitness Tracker Logo" class="brand-logo-img" />
      <span class="brand-title">FITTRACK <span class="brand-badge admin-badge">ADMIN</span></span>
    </a>

    <!-- Mobile Hamburger Toggler -->
    <button class="navbar-toggler border-0 shadow-none text-light p-2" type="button" (click)="toggleMenu()" aria-label="Toggle navigation">
      <i class="bi" [ngClass]="isMenuCollapsed ? 'bi-list fs-2' : 'bi-x-lg fs-2'"></i>
    </button>

    <!-- Collapsible Menu -->
    <div class="collapse navbar-collapse" [class.show]="!isMenuCollapsed">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3 gap-lg-1">
        <li class="nav-item">
          <a class="nav-link" routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
            <i class="bi bi-house-door me-1"></i> Home
          </a>
        </li>

        <!-- Workout Dropdown -->
        <li class="nav-item dropdown position-relative" [class.show]="workoutDropdownOpen">
          <a class="nav-link dropdown-toggle cursor-pointer" role="button" (click)="toggleWorkout($event)">
            <i class="bi bi-activity me-1"></i> Manage Workouts
          </a>
          <ul class="dropdown-menu dropdown-menu-dark custom-dropdown-menu shadow-lg border-0" [class.show]="workoutDropdownOpen">
            <li>
              <a class="dropdown-item py-2" routerLink="/adminaddworkout" (click)="closeMenu()">
                <i class="bi bi-plus-circle me-2 text-success"></i> Add New Plan
              </a>
            </li>
            <li>
              <a class="dropdown-item py-2" routerLink="/adminviewworkout" (click)="closeMenu()">
                <i class="bi bi-table me-2 text-info"></i> All Workout Plans
              </a>
            </li>
          </ul>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/requestedworkout" routerLinkActive="active" (click)="closeMenu()">
            <i class="bi bi-inbox-fill me-1"></i> User Requests
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/adminviewfeedback" routerLinkActive="active" (click)="closeMenu()">
            <i class="bi bi-chat-left-dots me-1"></i> All Feedbacks
          </a>
        </li>
      </ul>

      <!-- Admin Profile & Logout -->
      <div class="d-flex align-items-center gap-3 py-2 py-lg-0 flex-wrap">
        <div class="admin-badge-pill d-flex align-items-center gap-2">
          <i class="bi bi-shield-check text-warning"></i>
          <span>ADMIN ACCESS</span>
        </div>

        <button class="btn btn-outline-danger btn-logout d-flex align-items-center gap-1" (click)="onLogout()">
          <i class="bi bi-box-arrow-right"></i>
          <span>Logout</span>
        </button>
      </div>

    </div>
  </div>
</nav>
