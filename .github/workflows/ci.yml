name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-dotnet:
    name: Build & Verify .NET Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore FitnessTracker_Latest/dotnetapp/dotnetapp.csproj

      - name: Build Solution
        run: dotnet build FitnessTracker_Latest/dotnetapp/dotnetapp.csproj --configuration Release --no-restore

  frontend-angular:
    name: Build & Verify Angular Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: FitnessTracker_Latest/angularapp/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: FitnessTracker_Latest/angularapp
        run: npm ci || npm install

      - name: Build Angular App
        working-directory: FitnessTracker_Latest/angularapp
        run: npm run build

  ml-microservice:
    name: Verify Python ML Microservice
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: Medicine-Recommendation-and-Disease-Prediction-using-Random-Forest/requirements.txt

      - name: Install Dependencies
        working-directory: Medicine-Recommendation-and-Disease-Prediction-using-Random-Forest
        run: pip install -r requirements.txt

      - name: Python Syntax & Import Check
        working-directory: Medicine-Recommendation-and-Disease-Prediction-using-Random-Forest
        run: python -m py_compile main.py
